name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b packages/core packages/cloudflare packages/agent
      - run: bunx tsc --noEmit -p packages/cloudflare/ui/tsconfig.json
      - run: bun run --cwd packages/cloudflare build:ui
      - run: bun test
